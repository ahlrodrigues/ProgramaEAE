<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Alunos - EAE</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css?v=20260522-1" />
    <style>
      body {
        min-height: 100vh;
      }
      .page-shell {
        grid-template-columns: 1fr;
      }
      .workspace {
        max-width: 860px;
        width: 100%;
        margin: 0 auto;
      }
      .card {
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
      }
      .card h1 {
        margin: 0 0 8px;
        font-size: 1.7rem;
        line-height: 1.2;
      }
      .card p { margin: 0 0 10px; }
      form { margin-top: 16px; display: grid; gap: 12px; }
      label { display: grid; gap: 6px; font-weight: 600; }
      input { padding: 10px 12px; }
      .mensageiro-field input {
        width: 100%;
      }
      button { margin-top: 4px; }
      button:disabled { opacity: 0.65; cursor: wait; }
      .feedback { margin-top: 10px; font-weight: 600; min-height: 22px; }
      .feedback.ok { color: #166534; }
      .feedback.error { color: #b91c1c; }
      .header-info {
        font-weight: 600;
      }
      .turma-info-card {
        margin: 8px 0 2px;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        background: rgba(214, 240, 235, 0.35);
      }
      .turma-info-card .header-info {
        margin: 0;
        font-weight: 800;
        color: var(--ink);
      }
      .public-toast-region {
        position: fixed;
        right: var(--toast-offset-x, 24px);
        top: var(--toast-offset-y, 24px);
        z-index: 2000;
        width: min(var(--toast-max-width, 360px), calc(100vw - (var(--toast-offset-x, 24px) * 2)));
        display: grid;
        gap: var(--toast-gap, 12px);
      }
      .public-toast {
        border-radius: 12px;
        border: 1px solid #bfdbfe;
        background: #eff6ff;
        color: #1e3a8a;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.14);
        padding: 8px 10px;
      }
      .public-toast.is-success {
        border-color: #bbf7d0;
        background: #f0fdf4;
        color: #166534;
      }
      .public-toast.is-error {
        border-color: #fecaca;
        background: #fef2f2;
        color: #991b1b;
      }
      .public-toast strong {
        display: block;
        margin-bottom: 2px;
        font-size: 0.85rem;
        line-height: 1.2;
      }
      .public-toast p {
        margin: 0;
        font-size: 0.8rem;
        line-height: 1.25;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <main class="workspace">
        <section class="card saved-summary stack-card">
          <h1>Cadastro de aluno na turma</h1>
          <p class="list-hint">Preencha os dados para vincular-se automaticamente:</p>
          <div class="turma-info-card">
            <p id="turma-info" class="header-info">Carregando turma...</p>
          </div>
          <form id="signup-form" class="card-grid two-columns">
            <label class="full-row-field">
              <span>Nome</span>
              <input type="text" name="nome" required placeholder="Nome completo" />
            </label>
            <label>
              <span>E-mail</span>
              <input type="email" name="email" required placeholder="aluno@exemplo.org" />
            </label>
            <label class="mensageiro-field">
              <span>Mensageiro</span>
              <input type="text" name="mensageiro" placeholder="(00) 00000-0000" />
            </label>
            <div class="inline-actions form-inline-actions full-row-field">
              <button type="submit" id="submit-btn" class="primary-action">Cadastrar aluno</button>
            </div>
          </form>
          <p class="feedback" id="feedback"></p>
        </section>
      </main>
    </div>
    <div id="toast-region" class="public-toast-region" aria-live="polite" aria-atomic="true"></div>

    <script>
      (function () {
        const token = (window.location.pathname.match(/^\/public\/alunos\/([^/]+)\/?$/) || [])[1] || "";
        const turmaInfo = document.getElementById("turma-info");
        const form = document.getElementById("signup-form");
        const feedback = document.getElementById("feedback");
        const submitBtn = document.getElementById("submit-btn");
        const toastRegion = document.getElementById("toast-region");
        let toastDismissTimer = null;

        function setFeedback(message, type) {
          feedback.textContent = message || "";
          feedback.className = "feedback" + (type ? " " + type : "");
        }

        function formatDateBR(value) {
          const text = String(value || "").trim();
          if (!text) return "não informado";
          const match = text.match(/^(\d{4})-(\d{2})-(\d{2})$/);
          if (!match) return text;
          return match[3] + "/" + match[2] + "/" + match[1];
        }

        function showToast(kind, title, message) {
          if (!toastRegion) return;
          if (toastDismissTimer) {
            window.clearTimeout(toastDismissTimer);
            toastDismissTimer = null;
          }
          toastRegion.replaceChildren();
          const toast = document.createElement("div");
          toast.className = "public-toast " + (kind === "error" ? "is-error" : "is-success");
          const heading = document.createElement("strong");
          heading.textContent = title || "";
          const body = document.createElement("p");
          body.textContent = message || "";
          toast.appendChild(heading);
          toast.appendChild(body);
          toastRegion.appendChild(toast);
          toastDismissTimer = window.setTimeout(function () {
            toast.remove();
            toastDismissTimer = null;
          }, 3200);
        }

        async function loadTurma() {
          if (!token) {
            setFeedback("Link inválido.", "error");
            form.hidden = true;
            turmaInfo.textContent = "Não foi possível identificar a turma.";
            return;
          }
          const response = await fetch("/api/public/turma/" + encodeURIComponent(token));
          const data = await response.json().catch(() => ({}));
          if (!response.ok) {
            setFeedback(data.error || "Não foi possível abrir o formulário.", "error");
            form.hidden = true;
            turmaInfo.textContent = "Turma indisponível para cadastro.";
            return;
          }
          const turma = data.turma || {};
          const dirigente = turma.dirigenteNome || turma.ownerName || "não informado";
          turmaInfo.textContent = "Turma: " + (turma.nome || "não informada")
            + " · Tipo: " + (turma.tipo || "não informado")
            + " · Modalidade: " + (turma.modalidade || "não informada")
            + " · Início: " + formatDateBR(turma.inicio)
            + " · Dirigente: " + dirigente;
          setFeedback("");
        }

        form.addEventListener("submit", async function (event) {
          event.preventDefault();
          if (!token) return;
          const payload = Object.fromEntries(new FormData(form).entries());
          submitBtn.disabled = true;
          setFeedback("Enviando cadastro...", "");
          try {
            const response = await fetch("/api/public/programa/" + encodeURIComponent(token) + "/alunos", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok) {
              throw new Error(data.error || "Não foi possível concluir o cadastro.");
            }
            form.reset();
            setFeedback((data.aluno && data.aluno.nome ? data.aluno.nome : "Aluno") + " cadastrado(a) com sucesso.", "ok");
            showToast("success", "Cadastro salvo", "Aluno cadastrado com sucesso nesta turma.");
          } catch (error) {
            setFeedback(error.message || "Erro ao cadastrar aluno.", "error");
            showToast("error", "Erro no cadastro", error.message || "Não foi possível concluir o cadastro.");
          } finally {
            submitBtn.disabled = false;
          }
        });

        loadTurma().catch(function () {
          setFeedback("Erro ao carregar os dados da turma.", "error");
          form.hidden = true;
        });
      })();
    </script>
  </body>
</html>
